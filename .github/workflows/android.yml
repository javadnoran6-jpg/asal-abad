name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AsalAbad-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Publish Release for users
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk AsalAbad.apk
        gh release create "v1.1-build${{ github.run_number }}" AsalAbad.apk \
          --title "عسل آباد نسخه 1.1 (ساخت ${{ github.run_number }})" \
          --notes "دانلود و نصب فایل AsalAbad.apk"
